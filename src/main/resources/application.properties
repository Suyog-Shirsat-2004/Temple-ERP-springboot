spring.application.name=Temple ERP Java
server.port=${PORT:5000}

# MongoDB (use MONGO_URI in production, e.g. MongoDB Atlas/Railway connection string)
# Accept common Railway/provider variable names as fallbacks.
spring.data.mongodb.uri=${MONGO_URI:${MONGO_URL:${MONGODB_URI:mongodb://localhost:27017/temple_erp}}}
# Disabled auto index creation to avoid startup conflicts with existing indexes (e.g. users.email unique index).
spring.data.mongodb.auto-index-creation=false

# JWT (set a long random secret in production)
app.jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-long-random-string-for-production-use}
app.jwt.expire-ms=${JWT_EXPIRE_MS:2592000000}
app.jwt.remember-expire-ms=2592000000

# Admin bootstrap account (override via environment variables in production)
app.admin.username=${APP_ADMIN_USERNAME:Admin123}
app.admin.email=${APP_ADMIN_EMAIL:templeerp2027@gmail.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin@123}

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Thymeleaf / encoding (ensure ₹ and other UTF-8 symbols render correctly)
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Error handling / logging
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-exception=${SERVER_ERROR_INCLUDE_EXCEPTION:false}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:never}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.temple.erp=${LOG_LEVEL_APP:INFO}

# Email (Gmail SMTP) - configure via environment variables or Admin > Email Settings.
# Never commit real passwords/API keys. For Gmail use an App Password.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Production behind reverse proxy (Render) - helps with forwarded headers/scheme
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
