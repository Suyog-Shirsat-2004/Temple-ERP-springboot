spring.application.name=Temple ERP Java
server.port=${PORT:5000}

# MongoDB (keep same style as MERN; override via env in production)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/temple_erp}
# Disabled auto index creation to avoid startup conflicts with existing indexes (e.g. users.email unique index).
# Required indexes should already exist; MongoConfig drops the old unique users.email index on startup.
spring.data.mongodb.auto-index-creation=false

# JWT (change in production)
app.jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-long-random-string-for-production-use}
app.jwt.expire-ms=${JWT_EXPIRE_MS:2592000000}
app.jwt.remember-expire-ms=2592000000

# Hardcoded admin (change in production)
app.admin.username=Admin123
app.admin.email=templeerp2027@gmail.com
app.admin.password=admin@123

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Thymeleaf / encoding (ensure ₹ and other UTF-8 symbols render correctly)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Error page diagnostics (helpful during development)
server.error.include-message=always
server.error.include-exception=true

# Email (Gmail SMTP) - sends pass/token PDF to user email when approved/created.
# Set app.mail.enabled=true and configure credentials to enable.
# For Gmail: use an App Password (Google Account > Security > 2-Step Verification > App passwords).
# (Avoid committing real passwords to source control; prefer env vars or Admin > Email Settings.)
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:templeerp2027@gmail.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:templeerp2027@gmail.com}
spring.mail.password=${MAIL_PASSWORD:yjpugiqxtynwjwqn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
