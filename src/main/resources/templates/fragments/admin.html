<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<body>
<aside th:fragment="sidebar(active)" class="admin-sidebar" id="adminSidebar">
  <a th:href="@{/admin/dashboard}" class="admin-brand">
    <div class="admin-brand-icon"><i class="fas fa-om"></i></div>
    <div><div class="admin-brand-title">Temple ERP</div><div class="admin-brand-sub">Admin Panel</div></div>
  </a>
  <nav class="admin-nav-sec">
    <div style="margin-bottom:8px">
      <div class="admin-nav-title">Main</div>
      <a th:href="@{/admin/dashboard}" class="admin-nav-link" th:classappend="${active}=='dashboard' ? ' active' : ''"><i class="fas fa-home"></i><span>Dashboard</span></a>
    </div>
    <div style="margin-bottom:8px">
      <div class="admin-nav-title">Management</div>
      <a th:href="@{/admin/passes}" class="admin-nav-link" th:classappend="${active}=='passes' ? ' active' : ''"><i class="fas fa-ticket-alt"></i><span>Darshan Passes</span></a>
      <a th:href="@{/admin/bookings}" class="admin-nav-link" th:classappend="${active}=='bookings' ? ' active' : ''"><i class="fas fa-hotel"></i><span>Room Bookings</span></a>
      <a th:href="@{/admin/donations}" class="admin-nav-link" th:classappend="${active}=='donations' ? ' active' : ''"><i class="fas fa-rupee-sign"></i><span>Donations</span></a>
      <a th:href="@{/admin/devotees}" class="admin-nav-link" th:classappend="${active}=='devotees' ? ' active' : ''"><i class="fas fa-users"></i><span>Devotees</span></a>
      <a th:href="@{/admin/restaurant}" class="admin-nav-link" th:classappend="${active}=='restaurant' ? ' active' : ''"><i class="fas fa-utensils"></i><span>Restaurant</span></a>
      <a th:href="@{/admin/users}" class="admin-nav-link" th:classappend="${active}=='users' ? ' active' : ''"><i class="fas fa-user-cog"></i><span>Users</span></a>
      <a th:href="@{/admin/rooms}" class="admin-nav-link" th:classappend="${active}=='rooms' ? ' active' : ''"><i class="fas fa-door-open"></i><span>Rooms</span></a>
    </div>
    <div style="margin-bottom:8px">
      <div class="admin-nav-title">Content</div>
      <a th:href="@{/admin/festivals}" class="admin-nav-link" th:classappend="${active}=='festivals' ? ' active' : ''"><i class="fas fa-star"></i><span>Festivals</span></a>
      <a th:href="@{/admin/events}" class="admin-nav-link" th:classappend="${active}=='events' ? ' active' : ''"><i class="fas fa-calendar-alt"></i><span>Events</span></a>
      <a th:href="@{/admin/news}" class="admin-nav-link" th:classappend="${active}=='news' ? ' active' : ''"><i class="fas fa-newspaper"></i><span>News</span></a>
    </div>
    <div style="margin-bottom:8px">
      <div class="admin-nav-title">Reports</div>
      <a th:href="@{/admin/reports}" class="admin-nav-link" th:classappend="${active}=='reports' ? ' active' : ''"><i class="fas fa-chart-bar"></i><span>Analytics</span></a>
    </div>
    <div style="margin-bottom:8px">
      <div class="admin-nav-title">Settings</div>
      <a th:href="@{/admin/mail-settings}" class="admin-nav-link" th:classappend="${active}=='mail-settings' ? ' active' : ''"><i class="fas fa-envelope-open-text"></i><span>Email Settings</span></a>
    </div>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)">
      <a href="#" onclick="event.preventDefault(); document.getElementById('adminLogoutForm').submit();" class="admin-nav-link" style="color:#f87171"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
      <form id="adminLogoutForm" th:action="@{/logout}" method="post" style="display:none"></form>
    </div>
  </nav>
</aside>

<div th:fragment="topbar" class="admin-topbar">
  <div style="display:flex;align-items:center;gap:16px">
    <button type="button" class="admin-toggle" onclick="var s=document.getElementById('adminSidebar');var m=document.getElementById('adminMain');s.classList.toggle('closed');s.classList.toggle('open');m.classList.toggle('full');"><i class="fas fa-bars"></i></button>
    <a th:href="@{/admin/dashboard}" style="color:#6366f1;text-decoration:none;font-weight:600;font-size:14px"><i class="fas fa-home"></i> Temple ERP</a>
  </div>
  <div class="admin-user">
    <div style="text-align:right">
      <div style="font-weight:700;color:#1e293b;font-size:15px" th:text="${#authentication?.principal?.name ?: #authentication?.name ?: 'Admin'}">Admin</div>
      <div style="font-size:12px;color:#94a3b8" th:text="${#authentication?.principal?.email} ?: ''">templeerp2027@gmail.com</div>
    </div>
    <div class="admin-avatar" th:text="${#strings.substring((#authentication?.principal?.name ?: #authentication?.name ?: 'Admin') + ' ',0,1)}">A</div>
  </div>
</div>
</body>
</html>
