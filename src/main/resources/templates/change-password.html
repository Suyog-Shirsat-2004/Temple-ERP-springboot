<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Change Password - Temple ERP')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container page">
  <h2>Change Password</h2>
  <div class="alert err" th:if="${error}" th:text="${error}"></div>
  <div class="alert ok" th:if="${success}" th:text="${success}"></div>
  <form class="form card" th:action="@{/change-password}" method="post" style="max-width:520px">
    <div class="field">
      <label for="old_password">Current Password</label>
      <input id="old_password" type="password" name="old_password" autocomplete="current-password" required/>
    </div>
    <div class="field">
      <label for="new_password">New Password</label>
      <input id="new_password" type="password" name="new_password" minlength="6" autocomplete="new-password" required/>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm New Password</label>
      <input id="confirm_password" type="password" name="confirm_password" minlength="6" autocomplete="new-password" required/>
    </div>
    <button class="btn" type="submit"><i class="fas fa-key"></i> Update Password</button>
    <a class="btn" th:href="@{/profile}" style="margin-left:8px">Cancel</a>
  </form>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
