<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Admin Portal - Temple ERP')}"></head>
<body>
<div style="min-height:100vh;background:linear-gradient(135deg,#1e1b4b 0%, #1e1b4b 38%, #06b6d4 100%);position:relative;overflow-x:hidden;overflow-y:auto">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1">
    <div style="background:rgba(255,255,255,.98);border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,215,0,.1);overflow:hidden;width:100%;max-width:480px;animation:slideUp .8s ease">
      <div style="background:linear-gradient(135deg,#1e1b4b 0%, #06b6d4 100%);padding:50px 30px;text-align:center">
        <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,215,0,.2);color:#ffd700;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px"><i class="fas fa-shield-alt"></i> Secure Admin</div>
        <div style="width:90px;height:90px;background:rgba(255,215,0,.2);border:3px solid #ffd700;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:glow 2s ease-in-out infinite"><i class="fas fa-user-shield" style="font-size:40px;color:#ffd700"></i></div>
        <h1 style="color:#fff;font-weight:700;font-size:28px;margin-bottom:5px;text-shadow:2px 2px 4px rgba(0,0,0,.2)">Admin Portal</h1>
        <p style="color:rgba(255,255,255,.85);font-size:14px;font-weight:300;margin:0">Shri Trimbakeshwar Temple Management</p>
      </div>
      <div style="padding:40px 35px">
        <div th:if="${param.error}" style="background:rgba(220,53,69,.1);color:#dc3545;border:1px solid rgba(220,53,69,.2);border-radius:14px;padding:16px 20px;margin-bottom:25px;display:flex;align-items:flex-start;gap:12px;font-size:14px" role="alert">
          <i class="fas fa-exclamation-circle" style="font-size:20px;margin-top:1px"></i>
          <span><strong>Wrong information.</strong> The username/email or password you entered is incorrect. Please enter proper information and try again.</span>
        </div>
        <form th:action="@{/login}" method="post">
          <input type="hidden" name="loginType" value="admin"/>
          <div style="margin-bottom:25px">
            <label style="color:#4a5568;font-weight:500;margin-bottom:8px;display:block;font-size:14px"><i class="fas fa-user"></i> Username / Email</label>
            <div style="position:relative">
              <input type="text" name="username" placeholder="Enter admin username or email" required style="width:100%;padding:16px 18px 16px 55px;border:2px solid #e2e8f0;border-radius:14px;font-size:15px;background:#f8fafc"/>
              <i class="fas fa-user" style="position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#1e3c72;font-size:18px;pointer-events:none"></i>
            </div>
          </div>
          <div style="margin-bottom:25px">
            <label style="color:#4a5568;font-weight:500;margin-bottom:8px;display:block;font-size:14px"><i class="fas fa-lock"></i> Password</label>
            <div style="position:relative">
              <input id="apw" type="password" name="password" placeholder="Enter your password" required style="width:100%;padding:16px 18px 16px 55px;border:2px solid #e2e8f0;border-radius:14px;font-size:15px;background:#f8fafc"/>
              <i class="fas fa-lock" style="position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#1e3c72;font-size:18px;pointer-events:none"></i>
              <button type="button" onclick="var i=document.getElementById('apw');i.type=i.type==='password'?'text':'password'" style="position:absolute;right:18px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;padding:5px;font-size:16px"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <button type="submit" style="width:100%;padding:18px;background:linear-gradient(135deg,#1e1b4b 0%, #06b6d4 100%);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:1px;box-shadow:0 10px 22px rgba(30,27,75,.2)"><i class="fas fa-sign-in-alt"></i> Admin Login</button>
          <div style="background:linear-gradient(135deg,rgba(30,60,114,.05),rgba(42,82,152,.08));border:1px solid rgba(30,60,114,.1);border-radius:12px;padding:15px;margin-top:20px;text-align:center">
            <p style="color:#64748b;font-size:12px;margin:0;display:flex;align-items:center;justify-content:center;gap:8px"><i class="fas fa-lock" style="color:#28a745"></i> This is a secure admin area. All actions are logged.</p>
          </div>
        </form>
        <div style="margin-top:25px;padding-top:25px;border-top:1px solid #e2e8f0;text-align:center"><a th:href="@{/login}" style="color:#64748b;text-decoration:none;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px"><i class="fas fa-arrow-left"></i> Back to User Login</a></div>
        <div style="margin-top:10px;text-align:center"><a th:href="@{/}" style="color:#ffd700;text-decoration:none;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px"><i class="fas fa-home"></i> Back to Home</a></div>
      </div>
    </div>
  </div>
</div>
<style>@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(255,215,0,.3)}50%{box-shadow:0 0 40px rgba(255,215,0,.6),0 0 60px rgba(255,215,0,.3)}}@keyframes slideUp{from{opacity:0;transform:translateY(60px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}</style>
</body>
</html>
