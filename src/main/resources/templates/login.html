<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Temple ERP - Login')}"></head>
<body>
<div style="min-height:100vh;background:linear-gradient(135deg,#0f172a 0%, #0f172a 40%, #2563eb 100%);position:relative;overflow:hidden">
  <div class="admin-corner-zone" aria-label="Admin access area" style="position:fixed;top:0;right:0;width:20px;height:20px;z-index:20">
    <a class="admin-corner-icon" th:href="@{/admin/login}" title="Admin Login" tabindex="0" style="position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 20px rgba(0,0,0,.18);opacity:0;visibility:hidden;transform:translateY(-4px) scale(.96);transition:opacity .18s ease, visibility .18s ease, transform .18s ease;pointer-events:none"><i class="fas fa-user-shield"></i></a>
  </div>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1">
    <div style="background:rgba(255,253,248,.97);border-radius:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.16);overflow:hidden;width:100%;max-width:450px;animation:slideUp .8s ease">
      <div style="background:linear-gradient(135deg,#0f172a 0%, #2563eb 100%);padding:40px 30px;text-align:center;position:relative;overflow:hidden">
        <i class="fas fa-om" style="font-size:60px;color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,.5);display:block;margin-bottom:10px;animation:glow 2s ease-in-out infinite"></i>
        <h1 style="color:#fff;font-weight:700;font-size:28px;margin-bottom:5px;text-shadow:2px 2px 4px rgba(0,0,0,.2)">Temple ERP</h1>
        <p style="color:rgba(255,255,255,.9);font-size:14px;margin:0">Welcome back! Login to continue</p>
      </div>
      <div style="padding:40px 35px">
        <div th:if="${success}" style="background:rgba(72,187,120,.15);color:#276749;border:1px solid rgba(72,187,120,.3);border-radius:12px;padding:15px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px"><i class="fas fa-check-circle" style="font-size:20px"></i><span th:text="${success}"></span></div>
        <div th:if="${param.error}" style="background:rgba(252,129,129,.15);color:#c53030;border:1px solid rgba(252,129,129,.3);border-radius:12px;padding:15px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px" role="alert"><i class="fas fa-exclamation-circle" style="font-size:20px;margin-top:1px"></i><span><strong>Wrong information.</strong> The username/email or password you entered is incorrect. Please enter proper information and try again.</span></div>
        <div th:if="${param.logout}" style="background:rgba(72,187,120,.15);color:#276749;border:1px solid rgba(72,187,120,.3);border-radius:12px;padding:15px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px"><i class="fas fa-check-circle" style="font-size:20px"></i><span>You have been logged out.</span></div>
        <form th:action="@{/login}" method="post">
          <div style="margin-bottom:25px">
            <label style="color:#4a5568;font-weight:500;margin-bottom:8px;display:block">Username / Email</label>
            <div style="position:relative">
              <input type="text" name="username" placeholder="Enter your username or email" required style="width:100%;padding:14px 15px 14px 50px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;background:#f8fafc"/>
              <i class="fas fa-user" style="position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#667eea;font-size:18px;pointer-events:none"></i>
            </div>
          </div>
          <div style="margin-bottom:25px">
            <label style="color:#4a5568;font-weight:500;margin-bottom:8px;display:block">Password</label>
            <div style="position:relative">
              <input id="pw" type="password" name="password" placeholder="Enter your password" required style="width:100%;padding:14px 50px 14px 50px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;background:#f8fafc"/>
              <i class="fas fa-lock" style="position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#667eea;font-size:18px;pointer-events:none"></i>
              <button type="button" onclick="var i=document.getElementById('pw');i.type=i.type==='password'?'text':'password'" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:16px"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px">
            <label style="color:#64748b;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px"><input type="checkbox" name="remember-me" style="accent-color:#667eea"/> Remember me</label>
            <a th:href="@{/forgot-password}" style="color:#667eea;text-decoration:none;font-size:14px;font-weight:500">Forgot Password?</a>
          </div>
          <button type="submit" style="width:100%;padding:16px;background:linear-gradient(135deg,#0f172a 0%, #2563eb 100%);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 10px 20px rgba(15,23,42,.18)"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>
        <div style="display:flex;align-items:center;margin:30px 0"><div style="flex:1;border-bottom:1px solid #e2e8f0"></div><span style="padding:0 15px;color:#94a3b8;font-size:13px">OR</span><div style="flex:1;border-bottom:1px solid #e2e8f0"></div></div>
        <a th:href="@{/register}" style="width:100%;padding:16px;background:#fff;color:#667eea;border:2px solid #667eea;border-radius:12px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none"><i class="fas fa-user-plus"></i> Create New Account</a>
        <div style="margin-top:25px;text-align:center">
          <a th:href="@{/}" style="color:#667eea;display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border:2px solid #667eea;border-radius:25px;text-decoration:none;font-weight:500"><i class="fas fa-home"></i> Back to Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
<style>
@keyframes glow{0%,100%{text-shadow:0 0 20px rgba(255,215,0,.5)}50%{text-shadow:0 0 40px rgba(255,215,0,.8),0 0 60px rgba(255,215,0,.4)}}
@keyframes slideUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
/* Hidden admin icon: revealed only when mouse enters 20x20 top-right corner trigger */
.admin-corner-zone:hover, .admin-corner-zone:focus-within { width:64px !important; height:64px !important; }
.admin-corner-zone:hover .admin-corner-icon, .admin-corner-zone:focus-within .admin-corner-icon {
  opacity:1 !important; visibility:visible !important; transform:none !important; pointer-events:auto !important;
}
.admin-corner-icon:hover, .admin-corner-icon:focus { background:rgba(255,255,255,.22) !important; color:#fff !important; outline:none; }
</style>
</body>
</html>
