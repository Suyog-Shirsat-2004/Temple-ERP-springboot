<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Admin - Rooms')}"></head>
<body>
<div class="admin-shell">
  <aside th:replace="~{fragments/admin :: sidebar('rooms')}"></aside>
  <main class="admin-main" id="adminMain">
    <div th:replace="~{fragments/admin :: topbar}"></div>
    <div class="admin-content">
      <h1 style="font-size:24px;font-weight:800;color:#1e293b;margin:0 0 18px">Room Inventory &amp; Management</h1>
      <div th:if="${success}" style="background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;border-radius:12px;padding:12px 16px;margin-bottom:14px" th:text="${success}"></div>
      <div th:if="${error}" style="background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:12px 16px;margin-bottom:14px" th:text="${error}"></div>

      <div class="panel" style="margin-bottom:18px;padding:14px 16px">
        <h2 style="font-size:14px;font-weight:800;color:#334155;margin:0 0 10px"><i class="fas fa-images" style="color:#2563eb"></i> Room images (from <code>images/rooms</code>) — used for admin &amp; user display</h2>
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <div th:each="i : ${#numbers.sequence(1,8)}" style="text-align:center">
            <img th:src="@{'/images/rooms/r' + ${i} + '.jpg'}" th:alt="${'r' + i}" style="width:110px;height:78px;object-fit:cover;border-radius:10px;border:1px solid #e2e8f0;display:block"/>
            <span style="font-size:11px;color:#64748b" th:text="${'r' + i + '.jpg'}"></span>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-bottom:18px;padding:18px">
        <h2 style="font-size:16px;font-weight:800;color:#1e293b;margin:0 0 12px"><i class="fas fa-plus-circle" style="color:#2563eb"></i> Add New Room</h2>
        <form th:action="@{/admin/rooms/add}" method="post" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end">
          <div><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Room No. *</label><input name="room_number" required placeholder="e.g. R101" style="width:100%;padding:10px 12px;border:1px solid #d8e0ea;border-radius:10px"/></div>
          <div>
            <label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Room Name</label>
            <input name="room_name" list="roomNameOptions" placeholder="Select or type name" style="width:100%;padding:10px 12px;border:1px solid #d8e0ea;border-radius:10px"/>
            <datalist id="roomNameOptions">
              <option th:each="n : ${roomNameOptions}" th:value="${n}"></option>
            </datalist>
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Type</label>
            <select name="room_type" style="width:100%;padding:10px 12px;border:1px solid #d8e0ea;border-radius:10px;background:#fff">
              <option value="">-- Select Type --</option>
              <option th:each="t : ${roomTypeOptions}" th:value="${t}" th:text="${t}"></option>
            </select>
          </div>
          <div><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Price/Day (₹)</label><input name="price_per_day" type="number" step="0.01" min="0" placeholder="0.00" style="width:100%;padding:10px 12px;border:1px solid #d8e0ea;border-radius:10px"/></div>
          <div>
            <label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Capacity (Persons) *</label>
            <select name="capacity" required style="width:100%;padding:10px 12px;border:1px solid #d8e0ea;border-radius:10px;background:#fff">
              <option value="">-- Select Capacity --</option>
              <option th:each="c : ${capacityOptions}" th:value="${c}" th:text="${c + ' persons'}"></option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Status</label>
            <select name="status" style="width:100%;padding:10px 12px;border:1px solid #d8e0ea;border-radius:10px;background:#fff">
              <option th:each="s : ${roomStatusOptions}" th:value="${s}" th:text="${s}" th:selected="${s == 'available'}"></option>
            </select>
          </div>
          <div><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Amenities</label><input name="amenities" placeholder="WiFi, AC, Hot water" style="width:100%;padding:10px 12px;border:1px solid #d8e0ea;border-radius:10px"/></div>
          <div style="grid-column:1/-1"><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Description</label><input name="description" placeholder="Short description" style="width:100%;padding:10px 12px;border:1px solid #d8e0ea;border-radius:10px"/></div>
          <div><button type="submit" style="background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;width:100%"><i class="fas fa-save"></i> Add Room</button></div>
        </form>
      </div>

      <div class="panel" style="padding:0;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch">
        <table class="table" style="margin:0;box-shadow:none;border-radius:0;min-width:980px;width:100%">
          <thead><tr><th>Image</th><th>Room #</th><th>Name &amp; Details</th><th>Type</th><th>Capacity</th><th>Price/Day</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            <th:block th:each="r,stat : ${rooms}">
              <tr>
                <td><img th:src="@{'/images/rooms/r' + ${((stat.index % 8) + 1)} + '.jpg'}" alt="Room" style="width:72px;height:52px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0"/></td>
                <td th:text="${r.roomNumber}" style="font-weight:700;vertical-align:top"></td>
                <td style="vertical-align:top">
                  <div th:text="${r.roomName != null and !#strings.isEmpty(r.roomName) ? r.roomName : '-'}" style="font-weight:700;color:#1e293b"></div>
                  <div th:if="${r.amenities != null and !#strings.isEmpty(r.amenities)}" style="font-size:12px;color:#475569;margin-top:3px"><i class="fas fa-concierge-bell" style="color:#64748b"></i> <span th:text="${r.amenities}"></span></div>
                  <div th:if="${r.description != null and !#strings.isEmpty(r.description)}" style="font-size:12px;color:#64748b;margin-top:3px;white-space:pre-wrap;max-width:240px" th:text="${r.description}"></div>
                </td>
                <td th:text="${r.roomType != null ? r.roomType : '-'}" style="vertical-align:top"></td>
                <td style="vertical-align:top"><span th:text="${r.capacity != null ? (r.capacity + ' persons') : '-'}" style="font-weight:700;color:#334155"></span></td>
                <td style="vertical-align:top">₹<span th:text="${r.pricePerDay != null ? #numbers.formatDecimal(r.pricePerDay,1,'COMMA',2,'POINT') : '0.00'}"></span></td>
                <td style="vertical-align:top"><span class="badge" th:classappend="${r.status}" th:text="${r.status != null ? r.status : '-'}"></span></td>
                <td style="vertical-align:top;white-space:nowrap">
                  <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
                    <button type="button" onclick="var r=this.closest('tr').nextElementSibling;if(r){r.style.display=(r.style.display==='table-row'?'none':'table-row');}" style="background:#2563eb;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer"><i class="fas fa-edit"></i> Edit</button>
                    <form th:action="@{'/admin/rooms/' + ${r.id} + '/delete'}" method="post" onsubmit="return confirm('Delete this room?');" style="display:inline;margin:0">
                      <button type="submit" style="background:#ef4444;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer"><i class="fas fa-trash"></i> Delete</button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:id="${'edit-room-' + stat.index}" style="display:none;background:#f8fafc">
                <td colspan="8" style="padding:14px 16px">
                  <form th:action="@{'/admin/rooms/' + ${r.id} + '/update'}" method="post" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end;background:#fff;border:1px solid #d8e0ea;border-radius:12px;padding:14px">
                    <div style="grid-column:1/-1;font-weight:800;color:#1e293b"><i class="fas fa-pen" style="color:#2563eb"></i> Update Room (all details)</div>
                    <div><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Room No. *</label><input name="room_number" th:value="${r.roomNumber}" required style="width:100%;padding:9px 11px;border:1px solid #d8e0ea;border-radius:10px"/></div>
                    <div><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Room Name</label>
                      <input name="room_name" th:value="${r.roomName}" list="roomNameOptions" style="width:100%;padding:9px 11px;border:1px solid #d8e0ea;border-radius:10px"/>
                    </div>
                    <div><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Type</label>
                      <select name="room_type" style="width:100%;padding:9px 11px;border:1px solid #d8e0ea;border-radius:10px;background:#fff">
                        <option value="">-- Select Type --</option>
                        <option th:each="t : ${roomTypeOptions}" th:value="${t}" th:text="${t}" th:selected="${r.roomType != null and #strings.equalsIgnoreCase(r.roomType, t)}"></option>
                        <option th:if="${r.roomType != null and !#strings.isEmpty(r.roomType) and (roomTypeOptions == null or !#lists.contains(roomTypeOptions, r.roomType))}" th:value="${r.roomType}" th:text="${r.roomType}" selected="selected"></option>
                      </select>
                    </div>
                    <div><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Price/Day (₹)</label><input name="price_per_day" type="number" step="0.01" min="0" th:value="${r.pricePerDay}" style="width:100%;padding:9px 11px;border:1px solid #d8e0ea;border-radius:10px"/></div>
                    <div><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Capacity (Persons) *</label>
                      <select name="capacity" required style="width:100%;padding:9px 11px;border:1px solid #d8e0ea;border-radius:10px;background:#fff">
                        <option value="">-- Select Capacity --</option>
                        <option th:each="c : ${capacityOptions}" th:value="${c}" th:text="${c + ' persons'}" th:selected="${r.capacity != null and r.capacity == c}"></option>
                      </select>
                    </div>
                    <div><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Status</label>
                      <select name="status" style="width:100%;padding:9px 11px;border:1px solid #d8e0ea;border-radius:10px;background:#fff">
                        <option th:each="s : ${roomStatusOptions}" th:value="${s}" th:text="${s}" th:selected="${r.status != null and #strings.equalsIgnoreCase(r.status, s)}"></option>
                      </select>
                    </div>
                    <div style="grid-column:span 2"><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Amenities</label><input name="amenities" th:value="${r.amenities}" style="width:100%;padding:9px 11px;border:1px solid #d8e0ea;border-radius:10px"/></div>
                    <div style="grid-column:1/-1"><label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px">Description</label><input name="description" th:value="${r.description}" style="width:100%;padding:9px 11px;border:1px solid #d8e0ea;border-radius:10px"/></div>
                    <div><button type="submit" style="background:#16a34a;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;width:100%"><i class="fas fa-save"></i> Save Update</button></div>
                  </form>
                </td>
              </tr>
            </th:block>
            <tr th:if="${#lists.isEmpty(rooms)}"><td colspan="8" style="padding:28px;color:#64748b;text-align:center"><i class="fas fa-bed" style="font-size:28px;color:#cbd5e1;display:block;margin-bottom:8px"></i>No rooms yet. Use the form above to add rooms (admin access).</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
</body>
</html>
