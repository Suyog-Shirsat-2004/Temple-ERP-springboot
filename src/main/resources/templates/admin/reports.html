<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Admin - Reports')}"></head>
<body>
<div class="admin-shell">
  <aside th:replace="~{fragments/admin :: sidebar('reports')}"></aside>
  <main class="admin-main" id="adminMain">
    <div th:replace="~{fragments/admin :: topbar}"></div>
    <div class="admin-content">
      <h1 style="font-size:24px;font-weight:800;color:#1e293b;margin:0 0 18px">Reports &amp; Analytics</h1>
      <div class="stat-grid" style="margin-bottom:16px">
        <div class="stat-card"><div class="stat-icon" style="background:#fef3c7;color:#f59e0b"><i class="fas fa-donate"></i></div><div class="stat-value" th:text="${'₹' + #numbers.formatDecimal(donationTotal,1,'COMMA',2,'POINT')}">₹0</div><div class="stat-label">Donation Revenue (<span th:text="${donationsCount}">0</span> records)</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#ede9fe;color:#8b5cf6"><i class="fas fa-utensils"></i></div><div class="stat-value" th:text="${'₹' + #numbers.formatDecimal(restaurantRevenue,1,'COMMA',2,'POINT')}">₹0</div><div class="stat-label">Restaurant Revenue (<span th:text="${ordersCount}">0</span> orders)</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#fce7f3;color:#ec4899"><i class="fas fa-ticket-alt"></i></div><div class="stat-value" th:text="${'₹' + #numbers.formatDecimal(passRevenue,1,'COMMA',2,'POINT')}">₹0</div><div class="stat-label">Pass Revenue (<span th:text="${passesCount}">0</span> passes)</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#d1fae5;color:#10b981"><i class="fas fa-chart-line"></i></div><div class="stat-value" th:text="${'₹' + #numbers.formatDecimal(grandTotal,1,'COMMA',2,'POINT')}">₹0</div><div class="stat-label">Grand Total</div></div>
      </div>
      <div class="panel"><p style="margin:0;color:#64748b">For monthly trends and detailed per-devotee reports, use <code>GET /api/admin/dashboard</code> and <code>GET /api/admin/devotees/{id}</code>.</p></div>
    </div>
  </main>
</div>
</body>
</html>
