<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Reset Password - Temple ERP')}"></head><body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container page"><h2>Reset Password</h2>
<div class="alert ok" th:if="${success}" th:text="${success}"></div>
<div class="alert err" th:if="${error}" th:text="${error}"></div>
<form class="form card" th:action="@{/forgot-password}" method="post">
  <div class="field"><label>Email</label><input type="email" name="email" required maxlength="120" pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}" title="Enter a valid email address"/></div>
  <div class="field"><label>New Password</label><input type="password" name="new_password" minlength="6" required/></div>
  <div class="field"><label>Confirm Password</label><input type="password" name="confirm_password" minlength="6" required/></div>
  <button class="btn" type="submit">Reset Password</button>
  <p style="margin-top:10px;font-size:.9rem"><a th:href="@{/login}">Back to login</a></p>
</form></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
